name: Release Mac app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm run test
          npm run build

      - name: Package Electron app
        run: npx electron-builder --mac --publish never

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-chess-3d-mac
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true

      - name: Publish rolling “latest” release (manual / main builds)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest-mac
          VERSION=$(node -p "require('./package.json').version")
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" --title "Mac app (latest build)" --notes "Automated macOS build v${VERSION}. Download the .dmg — no Node or npm required."
          gh release upload "$TAG" release/*.dmg release/*.zip --clobber
